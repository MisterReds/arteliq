# Publish to PyPI on a version tag (v*) or a push to a branch release/v*, with PyPI Trusted Publishing (OIDC): no
# API token is stored anywhere. The branch form exists for sessions that may push branches but not tags.
# One-time setup on pypi.org: Publishing -> Add a pending publisher -> project "arteliq", owner "MisterReds",
# repository "arteliq", workflow "release.yml", environment "pypi".
name: Release

on:
  push:
    tags: ["v*"]
    branches: ["release/v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Tag matches the package version
        run: |
          v=$(python3 -c "import re;print(re.search(r'^version = \"([^\"]+)\"', open('pyproject.toml').read(), re.M).group(1))")
          test "v$v" = "${GITHUB_REF_NAME#release/}" || { echo "ref $GITHUB_REF_NAME != version $v"; exit 1; }
      - name: Build
        run: python3 -m pip install build twine && python3 -m build && python3 -m twine check dist/*
      - name: Smoke test the wheel in a clean venv
        run: |
          python3 -m venv /tmp/v && /tmp/v/bin/pip install dist/*.whl
          /tmp/v/bin/arteliq --help >/dev/null && /tmp/v/bin/artel --help >/dev/null
          cd /tmp && ARTEL_HOME=/tmp/home /tmp/v/bin/arteliq run "Сделай файл hello.txt" --provider scripted
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
