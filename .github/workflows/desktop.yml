name: Desktop

# Unsigned desktop bundles (Tauri shell + PyInstaller sidecar). Artifacts only: no releases, no signing yet.
on:
  push:
    branches: ["feat/native-desktop", "release/v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: linux, os: ubuntu-latest, bundles: "appimage,deb"}
          - {name: windows, os: windows-latest, bundles: "nsis"}
          - {name: macos, os: macos-latest, bundles: "dmg"}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Linux system libraries
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            libxdo-dev libssl-dev build-essential xvfb curl

      - name: Build the sidecar (PyInstaller onedir)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pyinstaller
          python desktop/sidecar/build.py
          ls desktop/sidecar/dist/arteliq | head

      - name: Sidecar answers /api/ready on its own
        run: |
          export HOME="$RUNNER_TEMP/sidecar-home" USERPROFILE="$RUNNER_TEMP/sidecar-home"
          mkdir -p "$HOME"
          exe=desktop/sidecar/dist/arteliq/arteliq; [ -f "$exe.exe" ] && exe="$exe.exe"
          "$exe" web --port 18799 > "$RUNNER_TEMP/sidecar.log" 2>&1 &
          pid=$!
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:18799/api/ready && ok=1 && break
            sleep 1
          done
          kill $pid || true
          [ "${ok:-}" = 1 ] || { cat "$RUNNER_TEMP/sidecar.log"; exit 1; }

      - name: Build the Tauri bundle
        working-directory: desktop
        env:
          NO_STRIP: "true"
        run: |
          npm install --no-audit --no-fund
          npx tauri build --bundles ${{ matrix.bundles }}

      - name: Smoke (Linux, xvfb, 20 s)
        if: matrix.name == 'linux'
        run: |
          export HOME="$RUNNER_TEMP/smoke-home"; mkdir -p "$HOME"
          export ARTELIQ_SIDECAR="$PWD/desktop/sidecar/dist/arteliq/arteliq" ARTEL_PORT=18798
          xvfb-run -a desktop/src-tauri/target/release/arteliq-desktop > "$RUNNER_TEMP/smoke.log" 2>&1 &
          for i in $(seq 1 20); do grep -q "sidecar ready" "$RUNNER_TEMP/smoke.log" && break; sleep 1; done
          sleep 2
          tail -20 "$RUNNER_TEMP/smoke.log"
          grep -q "sidecar ready on http://127.0.0.1:" "$RUNNER_TEMP/smoke.log"
          port=$(grep -o "sidecar ready on http://127.0.0.1:[0-9]*" "$RUNNER_TEMP/smoke.log" | grep -o "[0-9]*$" | head -1)
          curl -fsS "http://127.0.0.1:$port/api/ready"
          pkill -f arteliq-desktop || true

      - name: Collect bundles
        run: |
          mkdir -p out
          find desktop/src-tauri/target/release/bundle -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*-setup.exe' -o -name '*.dmg' \) -exec cp {} out/ \;
          ls -la out

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: arteliq-desktop-${{ matrix.name }}
          path: out/*
          if-no-files-found: error
